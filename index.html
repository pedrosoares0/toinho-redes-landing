    <!-- Oculta qualquer badge ou drawer do Netlify imediatamente no primeiro frame -->
    <style>
      #netlify-badge,
      .netlify-badge,
      [data-netlify-drawer],
      #netlify-drawer,
      iframe[src*="netlify"],
      iframe[id*="netlify"],
      div[class*="netlify-drawer"],
      netlifydrawer-app,
      div[style*="position: fixed"][style*="bottom"]:has(a[href*="netlify.com"]),
      div[style*="position:fixed"][style*="bottom"]:has(a[href*="netlify.com"]),
      div:has(> a[href*="netlify.com"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        transform: scale(0) !important;
      }
